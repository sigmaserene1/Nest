name: Nest Business agent

# Manual only. The hourly schedule was removed because the job fails (and
# emails a failure notice) whenever the agent secrets are not configured.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  settle-open-shares:
    runs-on: ubuntu-latest
    env:
      ARC_RPC_URL: ${{ secrets.ARC_RPC_URL }}
      NEST_BUSINESS_V2_ADDRESS: ${{ secrets.NEST_BUSINESS_V2_ADDRESS }}
      NEST_AGENT_ROOM_ID: ${{ secrets.NEST_AGENT_ROOM_ID }}
      NEST_AGENT_PRIVATE_KEY: ${{ secrets.NEST_AGENT_PRIVATE_KEY }}
    steps:
      - name: Check agent secrets
        id: guard
        run: |
          if [ -z "$NEST_AGENT_PRIVATE_KEY" ] || [ -z "$NEST_BUSINESS_V2_ADDRESS" ]; then
            echo "Agent secrets not configured; skipping."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.guard.outputs.ready == 'true'
      - uses: oven-sh/setup-bun@v2
        if: steps.guard.outputs.ready == 'true'
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
        if: steps.guard.outputs.ready == 'true'
      - run: bun scripts/run-business-agent.mjs
        if: steps.guard.outputs.ready == 'true'
