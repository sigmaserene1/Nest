name: Install Privy auth dependencies

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/install-privy-auth.yml"

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Add Privy packages
        run: bun add @privy-io/react-auth@3.48.1 @privy-io/node@0.35.0
      - name: Commit dependency lock
        run: |
          if git diff --quiet -- package.json bun.lock; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json bun.lock
          git commit -m "Add Privy authentication dependencies"
          git push origin HEAD:main
