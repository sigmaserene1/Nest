name: Deploy Nest Bridge Registry

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-bridge-registry.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-testnet:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[deploy-bridge-registry]')
    runs-on: ubuntu-latest
    env:
      ARC_NETWORK: testnet
      ARC_RPC_URL: ${{ secrets.ARC_RPC_URL }}
      DEPLOYER_PRIVATE_KEY: ${{ secrets.DEPLOYER_PRIVATE_KEY }}
      NEST_AGENT_PRIVATE_KEY: ${{ secrets.NEST_AGENT_PRIVATE_KEY }}
    steps:
      - name: Select Testnet signer
        run: |
          KEY="$DEPLOYER_PRIVATE_KEY"
          if [ -z "$KEY" ]; then
            KEY="$NEST_AGENT_PRIVATE_KEY"
          fi
          if [ -z "$KEY" ]; then
            echo "::error::Neither DEPLOYER_PRIVATE_KEY nor NEST_AGENT_PRIVATE_KEY is configured."
            exit 1
          fi
          echo "::add-mask::$KEY"
          echo "DEPLOYER_PRIVATE_KEY=$KEY" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Deploy NestBridgeRegistry to Arc Testnet
        run: bun scripts/deploy-bridge-registry.mjs
