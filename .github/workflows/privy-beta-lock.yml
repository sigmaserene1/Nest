name: Privy beta dependency lock
on:
  push:
    branches: ["feature/privy-box-otp"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Resolve dependency lock and commit only on beta branch
        run: |
          bun install
          git add bun.lock
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Update bun lockfile for Privy beta'
            git push origin HEAD:feature/privy-box-otp
          fi
      - run: bunx tsc --noEmit
      - run: bun run build
