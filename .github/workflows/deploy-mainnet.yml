name: Deploy Nest contracts to Arc Mainnet

on:
  workflow_dispatch:
    inputs:
      confirm_mainnet:
        description: "Type DEPLOY_MAINNET to authorize a real Arc Mainnet deployment"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: nest-arc-mainnet-deployment
  cancel-in-progress: false

jobs:
  deploy:
    if: inputs.confirm_mainnet == 'DEPLOY_MAINNET'
    runs-on: ubuntu-latest
    env:
      ARC_NETWORK: mainnet
      ARC_RPC_URL: ${{ secrets.ARC_MAINNET_RPC_URL }}
      DEPLOYER_PRIVATE_KEY: ${{ secrets.DEPLOYER_PRIVATE_KEY }}
      CONFIRM_MAINNET_DEPLOY: YES
    steps:
      - name: Check Mainnet confirmation and deployer secret
        env:
          CONFIRMATION: ${{ inputs.confirm_mainnet }}
        run: |
          if [ "$CONFIRMATION" != "DEPLOY_MAINNET" ]; then
            echo "::error::Type DEPLOY_MAINNET in the workflow input to continue."
            exit 1
          fi
          if [ -z "$DEPLOYER_PRIVATE_KEY" ]; then
            echo "::error::DEPLOYER_PRIVATE_KEY is not configured in repository secrets."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Deploy ExpenseManager to Arc Mainnet
        run: bun scripts/deploy-expense-manager.mjs

      - name: Deploy NestBridgeRegistry to Arc Mainnet
        run: bun scripts/deploy-bridge-registry.mjs

      - name: Deploy NestTreasuryV3 to Arc Mainnet
        run: bun scripts/deploy-treasury-v3.mjs

      - name: Deployment handoff
        run: |
          echo "Copy the three VITE_NEST_*_MAINNET_* values from the logs into the production frontend environment."
          echo "Keep VITE_ARC_DEFAULT_NETWORK=testnet until the Mainnet contracts and production build have been verified."
