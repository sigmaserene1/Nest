name: Verify Nest Treasury V3

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/verify-treasury-v3.yml"
      - "scripts/verify-treasury-v3.mjs"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-testnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Verify NestTreasuryV3 on Arc Testnet explorer
        run: bun scripts/verify-treasury-v3.mjs
